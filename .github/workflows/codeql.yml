name: CodeQL

# NOTE: CodeQL (GHAS) requires GitHub Advanced Security, which is only free
# for public repos. This workflow is intentionally disabled while the repo is
# private. Uncomment the triggers below when the repo is made public (M3).
# Results will appear in Security → Code scanning alerts.
on:
  workflow_dispatch:  # manual only until the repo is public
  # push:
  #   branches: [main]
  #   paths-ignore: ["**.md", "docs/**"]
  # schedule:
  #   - cron: "0 8 * * 1"  # Monday 08:00 UTC

permissions:
  contents: read
  security-events: write  # required for CodeQL to upload SARIF results

jobs:
  security:
    uses: flagstonehq/.github/.github/workflows/codeql.yml@main
    with:
      language: go
