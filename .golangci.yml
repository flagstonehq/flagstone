version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - nilerr
    - noctx
    - revive
    - gocritic
    - misspell
    - whitespace
    - gosec

  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: range
        - name: time-naming
        - name: unexported-return
        - name: unused-parameter
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
    gosec:
      excludes:
        - G115

  exclusions:
    rules:
      - path: '_test\.go'
        linters:
          - errcheck
          - gosec
          - noctx
      - path: '_test\.go'
        text: "httpNoBody"
        linters:
          - gocritic
      - path: '_test\.go'
        text: "unused-parameter"
        linters:
          - revive
      - path: '_test\.go'
        text: "SA4006"
        linters:
          - staticcheck
      - path: "internal/testutil/"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
