# =============================================================================
# Flagstone — Local development stack
# =============================================================================
# Usage:
#   docker compose up -d        # Start Postgres + Redis
#   docker compose down          # Stop everything
#   docker compose down -v       # Stop + delete volumes (fresh DB)
#
# The Flagstone server itself runs on the host via `make run` or `go run`.
# This compose file only provides the dependencies.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: flagstone-postgres
    environment:
      POSTGRES_DB: flagstone
      POSTGRES_USER: flagstone
      POSTGRES_PASSWORD: flagstone_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagstone"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flagstone-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
