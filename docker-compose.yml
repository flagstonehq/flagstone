services:
  postgres:
    image: postgres:16-alpine
    container_name: flagstone_postgres
    environment:
      POSTGRES_USER: flagstone
      POSTGRES_PASSWORD: flagstone_dev
      POSTGRES_DB: flagstone
    ports:
      - "5432:5432"
    volumes:
      - flagstone-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagstone -d flagstone"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flagstone_redis
    ports:
      - "6379:6379"
    volumes:
      - flagstone-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flagstone_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://flagstone:flagstone_dev@postgres:5432/flagstone?sslmode=disable
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://flagstone:flagstone_dev@postgres:5432/flagstone?sslmode=disable", "up"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flagstone_api
    environment:
      DATABASE_URL: postgres://flagstone:flagstone_dev@postgres:5432/flagstone?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars}
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: flagstone_web
    environment:
      BACKEND_URL: http://api:8080
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flagstone_seed
    environment:
      BACKEND_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    profiles: ["seed"]
    entrypoint: ["seed"]

volumes:
  flagstone-postgres-data:
  flagstone-redis-data:
